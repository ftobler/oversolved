# Gitea's full gate. Both forges read this file, but every job is gated to
# Gitea; GitHub runs its own full suite in ci-github.yaml instead, and keeps
# pages-github.yaml main-only for the site publish.
#
# Two tiers, keyed on the branch. Every push and PR runs the regular jobs, with
# the arm64 leg reduced to compiling (it is a slow self-hosted box that falls
# hours behind dev if it runs vitest on every push). A push to main is the full
# gate: the arm64 leg runs vitest too, and the long fuzz job runs. A manual
# dispatch on main reruns that full gate.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}  # just some name to tell which other jobs to cancel
  cancel-in-progress: false

jobs:
  # Python is build-time tooling only now (icon generation plus the lint/docs
  # guards); the app itself is browser-only, so this job needs no database and
  # no GL/X stack.
  python:
    if: github.server_url != 'https://github.com'  # gitea
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      # The package declares no runtime dependencies, so this proves the icon
      # generator still runs off the dev extra alone (pycairo).
      - name: Smoke test (icon generation)
        run: python oversolved/icons.py

      # flake8 stays the CI lint (the local gate is `just ruff`); it is the
      # stable safety net for the same E/F/W rule set. Targets mirror the
      # justfile mypy/ruff recipes: package, tests, lint.py, mergeCorpus.py.
      - name: flake8
        run: flake8 oversolved tests lint.py frontend/scripts/mergeCorpus.py

      - name: mypy
        run: mypy tests/ oversolved/ lint.py frontend/scripts/mergeCorpus.py

      # The comment-style linter's Python dialect (dashes, banners) is local to
      # `just lint-py` otherwise; run it here so the same files are enforced.
      - name: Comment lint (Python)
        run: python lint.py oversolved tests frontend/scripts --language python

      - name: pytest
        run: pytest tests

      - name: Build wheel
        run: pip install build && python -m build

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: oversolved-wheel
          path: dist/*.whl

  frontend:
    if: github.server_url != 'https://github.com'  # gitea
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [22, 24, 26]
        include:
          - os: ubuntu-latest-arm64  # self-hosted runner label
            node-version: 26
            light: true  # build and lint only, except on main
    runs-on: ${{ matrix.os }}
    env:
      # 'true' or 'false' as a string; the x86 legs always test, the light arm64
      # leg only on main.
      RUN_TESTS: ${{ !matrix.light || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Generate constraint icons
        run: python oversolved/icons.py

      - name: Setup Node v${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci
        working-directory: frontend

      - name: npm build
        run: npm run build
        working-directory: frontend

      - name: npm lint
        run: npm run lint
        working-directory: frontend

      - name: Comment lint (lint.py)
        run: python lint.py frontend/src frontend/scripts

      # ~70 test files under src/kernel self-skip when their dependencies are
      # absent: they gate on OCC.js being importable (describe.skipIf(!oc), or a
      # local hasOcc helper) and most also need the Rust pkg-node builds. Without
      # both, the whole B-rep layer silently passes as skipped. Install OCC.js
      # and build BOTH crates here so `vitest run` actually exercises them
      # (matches the local `just wasm` + `just frontend` flow): sketch-solver
      # backs the sketch/topology tests, mate-solver backs solveAssemblyReal.
      # fullDocRegression.test.ts (the frozen full-document replay) and the
      # reference-oracle corpus (frontend/oracle, docs/oracle.md drift) run here
      # too and fail, rather than skip, under CI when any of it is missing.
      # sketch-solver's nodejs build carries `--features fuzz` because
      # sketchRepros.test.ts drives the fuzz-gated oracle export; the web build
      # stays feature-free. The build is identical across the Node matrix.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build WASM solvers (nodejs for vitest)
        run: |
          wasm-pack build --target nodejs --out-dir pkg-node --release -- --features fuzz
          cd ../mate-solver && wasm-pack build --target nodejs --out-dir pkg-node --release
        working-directory: sketch-solver

      # The notice bundles are generated artifacts, and serving the app
      # distributes everything they cover. The vitest gate checks them too, but
      # its rust half self-skips where cargo is absent, so the check is also run
      # here where both toolchains are known to be present and a skip would be
      # a lie rather than a convenience.
      #
      # Before occ:install on purpose: that is an `npm i --no-save` of a package
      # deliberately outside the declared tree, and the npm half of this check
      # reads the installed tree. Running first means the check can never be
      # answering a question about a tree the app does not actually have.
      - name: Third-party notices are current
        run: npm run licenses:check
        working-directory: frontend

      # OCC.js serves only the tests, so a light leg skips its download too.
      - name: Install OCC.js (opt-in, not a package.json dep)
        if: env.RUN_TESTS == 'true'
        run: npm run occ:install
        working-directory: frontend

      - name: npm test (vitest)
        if: env.RUN_TESTS == 'true'
        run: npx vitest run
        working-directory: frontend
        env:
          KERNEL_PROVISIONED: "1"  # arms the fullDocRegression + oracle provisioning guards

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ matrix.os }}-node${{ matrix.node-version }}
          path: frontend/dist/

  rust:
    if: github.server_url != 'https://github.com'  # gitea
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # lint.py is stdlib-only, so a bare venv is all `just rust-lint` needs to
      # resolve .venv/bin/python. This job drives the just recipes so the local
      # and CI command sets cannot drift.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m venv .venv

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: "Test (workspace: solver-core + sketch-solver + mate-solver)"
        run: just rust-test

      - name: Format check
        run: just rust-fmt

      - name: Lint (clippy + comment lint)
        run: just rust-lint

      - name: Build WASM (web + nodejs, both solver crates)
        run: |
          cd sketch-solver
          wasm-pack build --target web --out-dir pkg --release
          wasm-pack build --target nodejs --out-dir pkg-node --release
          cd ../mate-solver
          wasm-pack build --target web --out-dir pkg --release
          wasm-pack build --target nodejs --out-dir pkg-node --release

  # The long fuzz suite, on main only: the seeded session fuzz, the full
  # action-matrix sweep and the geometry fuzz take about an hour together, so
  # they never join a dev, feature or PR run. The provisioning mirrors the
  # frontend job (nodejs WASM solvers + OCC.js) because all three recipes use
  # the real kernel where it is installed; the recipes tee their full output to
  # tmp/ and keep their exit codes, so each job step is its own gate, and the
  # logs upload as the fuzz report artifact. The three sweeps are separate
  # steps so the job view names the failing suite and shows its own duration;
  # `!cancelled()` lets the remaining sweeps run after one fails, because the
  # artifact is the report and any failed step still fails the job.
  fuzz:
    if: github.server_url != 'https://github.com' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fuzz')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci
        working-directory: frontend

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      # sketch-solver's nodejs build carries `--features fuzz` for the
      # sketchRepros oracle export (`just wasm` matches); the web build stays
      # feature-free.
      - name: Build WASM solvers (nodejs for vitest)
        run: |
          wasm-pack build --target nodejs --out-dir pkg-node --release -- --features fuzz
          cd ../mate-solver && wasm-pack build --target nodejs --out-dir pkg-node --release
        working-directory: sketch-solver

      - name: Install OCC.js (opt-in, not a package.json dep)
        run: npm run occ:install
        working-directory: frontend

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Fuzz session (real kernel)
        if: ${{ !cancelled() }}
        run: just fuzz-session 200 40

      - name: Action matrix (real kernel)
        if: ${{ !cancelled() }}
        run: just action-matrix

      - name: Geometry fuzz (real kernel)
        if: ${{ !cancelled() }}
        run: just fuzz-geometry 1500 2

      # The fuzz logs are the job's report: a failing sweep leaves the seed,
      # step and refusal lines in its log even when the step aborts.
      - name: Upload fuzz logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-logs
          path: tmp/*.log
          if-no-files-found: ignore
