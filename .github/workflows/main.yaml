# GitHub side: a sanity check plus the Pages deploy, on main only. Gitea runs
# the full matrix from ci.yaml on every push and PR, so main arrives here
# pre-checked and this need not repeat that gate. The kernel tests self-skip
# without OCC.js and the pkg-node solver builds, which is accepted here.
name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    # Gitea Actions would also read this file; no-op there.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install cairo  # the GitHub image lacks the pycairo build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: flake8
        run: flake8 oversolved tests lint.py frontend/scripts/mergeCorpus.py

      - name: pytest
        run: pytest tests

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci
        working-directory: frontend

      - name: npm lint
        run: npm run lint
        working-directory: frontend

      - name: Comment lint (lint.py)
        run: python lint.py frontend/src frontend/scripts

      - name: npm build
        run: npm run build
        working-directory: frontend

      - name: npm test (vitest)
        run: npx vitest run
        working-directory: frontend

  # GitHub Pages deploy, only after `check` is green, so it is a no-op on Gitea
  # too. The ref guard keeps a manual dispatch from another branch from
  # publishing it. Pages serves a project site under /<repo>/, hence `--base`;
  # the app prefixes its public assets and router with import.meta.env.BASE_URL.
  pages:
    if: github.server_url == 'https://github.com' && github.ref == 'refs/heads/main'
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages  # one deploy at a time; a queued one waits rather than cancels a live one
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build WASM solvers (web, served from public/wasm)
        run: |
          wasm-pack build --target web --out-dir pkg --release
          cd ../mate-solver && wasm-pack build --target web --out-dir pkg --release
        working-directory: sketch-solver

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci
        working-directory: frontend

      # The same provisioning `just install` + `just wasm` do locally: OCC.js
      # into public/occ (~66 MB, under the 100 MB Pages file limit) and the
      # solver pkgs into public/wasm.
      - name: Provision OCC.js and the solvers into public/
        run: |
          npm run occ:install
          npm run occ:provision
          node scripts/copyWasm.mjs
        working-directory: frontend

      - name: Build for /${{ github.event.repository.name }}/
        run: npm run build -- --base=/${{ github.event.repository.name }}/
        working-directory: frontend

      # LGPL corresponding source for the OCC binary in /occ/, served from the
      # same site at the relative links in third_party/opencascade/README.md.
      # The pinned digests fail the deploy if upstream moves an archive.
      - name: Ship the OpenCascade source beside the binary
        run: node frontend/scripts/fetchOccSource.mjs frontend/dist/third_party/opencascade/source

      # Pages has no rewrite rules. Its 404 page is served for any unknown path,
      # so making it the app lets a deep link or reload on /workspaces/... boot
      # the router instead of showing GitHub's 404.
      - name: SPA fallback
        run: cp frontend/dist/index.html frontend/dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deploy
        uses: actions/deploy-pages@v4
