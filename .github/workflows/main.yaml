# GitHub side: a sanity check, on main only. Gitea runs
# the full matrix from ci.yaml on every push and PR, so main arrives here
# pre-checked and this need not repeat that gate. The kernel tests self-skip
# without OCC.js and the pkg-node solver builds, which is accepted here.
name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    # Gitea Actions would also read this file; no-op there.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install cairo  # the GitHub image lacks the pycairo build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: flake8
        run: flake8 oversolved tests lint.py frontend/scripts/mergeCorpus.py

      - name: pytest
        run: pytest tests

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci
        working-directory: frontend

      - name: npm lint
        run: npm run lint
        working-directory: frontend

      - name: Comment lint (lint.py)
        run: python lint.py frontend/src frontend/scripts

      - name: npm build
        run: npm run build
        working-directory: frontend

      - name: npm test (vitest)
        run: npx vitest run
        working-directory: frontend
