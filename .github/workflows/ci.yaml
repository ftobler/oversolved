name: CI

on: [push, pull_request]

concurrency:
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oversolved
          POSTGRES_USER: oversolved
          POSTGRES_PASSWORD: oversolved
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oversolved"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libglu1-mesa \
            libglib2.0-0 \
            libxext6 \
            libxrender1 \
            libsm6 \
            libice6 \
            xvfb

      - name: Smoke test (prod deps only)
        env:
          OVERSOLVED_ADMIN_PASSWORD: smoke
        run: |
          pip install -e .
          oversolved --help
          python -c "from oversolved import cli; print('OK')"
          python -c "import importlib; has_vtk = importlib.util.find_spec('vtkmodules') is not None; print('HAS_VTK:', has_vtk)"
          if python -c "import importlib; exit(0 if importlib.util.find_spec('vtkmodules') is not None else 1)"; then
            python -c 'from oversolved.app import create_app; create_app({"TESTING": True}); print("OK")' || echo "SKIP: app startup failed (postgres likely unavailable in smoke environment)"
          else
            echo "SKIP: vtkmodules not available, skipping app import test"
          fi

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Install solver deps (optional, for kernel tests)
        run: pip install -e ".[solver]" || echo "Solver deps not available — kernel tests will skip"

      - name: flake8
        run: flake8 oversolved tests

      - name: mypy
        run: mypy oversolved tests

      - name: pytest
        env:
          TEST_DB_DSN: postgresql://oversolved:oversolved@postgres:5432/oversolved
        run: pytest tests

      - name: Build wheel
        run: pip install build && python -m build

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v3
        with:
          name: oversolved-wheel-${{ matrix.python-version }}
          path: dist/*.whl

  frontend:
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [20, 22, 24]
        include:
          - os: ubuntu-latest-arm64
            node-version: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Generate constraint icons
        run: python oversolved/icons.py

      - name: Setup Node v${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: npm install
        run: npm install
        working-directory: frontend

      - name: npm build
        run: npm run build
        working-directory: frontend

      # Exercise the zero-backend deploy build on every Node version in the
      # matrix. The JS bundle is byte-identical to `npm run build`; this adds the
      # runtime-config stamp, so we catch a broken writeRuntimeConfig across all
      # supported Node runtimes.
      - name: npm build:static
        run: npm run build:static
        working-directory: frontend

      - name: npm lint
        run: npm run lint
        working-directory: frontend

      # The wasm-kernel/*.test.ts solver-boundary tests self-skip when the Rust
      # solver build (pkg-node) is absent. Build it here so `vitest run` actually
      # exercises them instead of silently skipping (matches the local `just wasm`
      # + `just frontend` flow). The build is identical across the Node matrix.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM solver (nodejs for vitest)
        run: wasm-pack build --target nodejs --out-dir pkg-node --release
        working-directory: sketch-solver

      - name: npm test (vitest)
        run: npx vitest run
        working-directory: frontend

      - name: Upload frontend build
        uses: actions/upload-artifact@v3
        with:
          name: frontend-dist-${{ matrix.os }}
          path: frontend/dist/

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Test
        run: cargo test
        working-directory: sketch-solver

      - name: Lint (clippy)
        run: cargo clippy -- -D warnings
        working-directory: sketch-solver

      - name: Build WASM (web + nodejs)
        run: |
          wasm-pack build --target web --out-dir pkg --release
          wasm-pack build --target nodejs --out-dir pkg-node --release
        working-directory: sketch-solver

  # Full-document parity gate. Runs the TS kernel (OCC.js + Rust sketch solver)
  # against the frozen regression baseline (a golden snapshot of the now-deleted
  # Python kernel) and hard-fails on any divergence. The Python kernel was removed
  # in phase 4d, so this is a post-migration regression gate, not a live
  # old-vs-new comparison. Heavy: OCC.js ~66 MB download + WASM compile.
  parity:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM solver (nodejs for vitest)
        run: wasm-pack build --target nodejs --out-dir pkg-node --release
        working-directory: sketch-solver

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm install
        run: npm install
        working-directory: frontend

      - name: Install OCC.js (opt-in, not a package.json dep)
        run: npm run occ:install
        working-directory: frontend

      # Defense-in-depth: pkg-node is already built above, so run the solver
      # boundary tests here too. Keeps them covered even if the wasm build is
      # ever dropped from the `frontend` job. OCC.js is not needed for these.
      - name: Solver boundary tests (wasm-kernel)
        run: npx vitest run src/wasm-kernel
        working-directory: frontend

      - name: Parity gate (hard-fail)
        run: npx vitest run --config vitest.parity.config.ts
        working-directory: frontend
