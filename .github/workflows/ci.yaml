name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libglu1-mesa \
            libglib2.0-0 \
            libxext6 \
            libxrender1 \
            libsm6 \
            libice6 \
            xvfb

      - name: Smoke test (prod deps only)
        env:
          OVERSOLVED_ADMIN_PASSWORD: smoke
        run: |
          pip install -e .
          oversolved --help
          python -c "from oversolved import cli; print('OK')"
          python -c "import importlib; has_vtk = importlib.util.find_spec('vtkmodules') is not None; print('HAS_VTK:', has_vtk)"
          if python -c "import importlib; exit(0 if importlib.util.find_spec('vtkmodules') is not None else 1)"; then
            python -c "from oversolved.app import create_app; app = create_app({'TESTING': True}); print('OK')"
          else
            echo "SKIP: vtkmodules not available, skipping app import test"
          fi

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Install solver deps (optional, for kernel tests)
        run: pip install -e ".[solver]" || echo "Solver deps not available — kernel tests will skip"

      - name: flake8
        run: flake8 oversolved tests

      - name: mypy
        run: mypy oversolved tests

      - name: pytest
        run: pytest tests

      - name: Build wheel
        run: pip install build && python -m build

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v3
        with:
          name: oversolved-wheel-${{ matrix.python-version }}
          path: dist/*.whl

  frontend:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-latest-arm64]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Generate constraint icons
        run: python oversolved/icons.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm install
        run: npm install
        working-directory: frontend

      - name: npm build
        run: npm run build
        working-directory: frontend

      - name: npm lint
        run: npm run lint
        working-directory: frontend

      - name: npm test (vitest)
        run: npx vitest run
        working-directory: frontend

      - name: Upload frontend build
        uses: actions/upload-artifact@v3
        with:
          name: frontend-dist-${{ matrix.os }}
          path: frontend/dist/
