name: CI

on: [push, pull_request]

concurrency:
  cancel-in-progress: false

jobs:
  # Python is build-time tooling only now (icon generation plus the lint/docs
  # guards); the app itself is browser-only, so this job needs no database and
  # no GL/X stack.
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      # The package declares no runtime dependencies, so this proves the icon
      # generator still runs off the dev extra alone (pycairo) on every
      # supported Python.
      - name: Smoke test (icon generation)
        run: python oversolved/icons.py

      - name: flake8
        run: flake8 oversolved tests

      - name: mypy
        run: mypy oversolved tests

      - name: pytest
        run: pytest tests

      - name: Build wheel
        run: pip install build && python -m build

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: oversolved-wheel-${{ matrix.python-version }}
          path: dist/*.whl

  frontend:
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [20, 22, 24]
        include:
          - os: ubuntu-latest-arm64
            node-version: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Generate constraint icons
        run: python oversolved/icons.py

      - name: Setup Node v${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: npm install
        run: npm install
        working-directory: frontend

      - name: npm build
        run: npm run build
        working-directory: frontend

      - name: npm lint
        run: npm run lint
        working-directory: frontend

      - name: Comment lint (lint.py)
        run: python lint.py frontend/src frontend/scripts

      # ~70 test files under src/kernel self-skip when their dependencies are
      # absent: they gate on OCC.js being importable (describe.skipIf(!oc), or a
      # local hasOcc helper) and most also need the Rust pkg-node builds. Without
      # both, the whole B-rep layer silently passes as skipped. Install OCC.js
      # and build BOTH crates here so `vitest run` actually exercises them
      # (matches the local `just wasm` + `just frontend` flow): sketch-solver
      # backs the sketch/topology tests, mate-solver backs solveAssemblyReal.
      # fullDocParity.test.ts stays excluded from this default suite and runs in
      # the parity job instead, so nothing runs twice. The build is identical
      # across the Node matrix.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM solvers (nodejs for vitest)
        run: |
          wasm-pack build --target nodejs --out-dir pkg-node --release
          cd ../mate-solver && wasm-pack build --target nodejs --out-dir pkg-node --release
        working-directory: sketch-solver

      - name: Install OCC.js (opt-in, not a package.json dep)
        run: npm run occ:install
        working-directory: frontend

      - name: npm test (vitest)
        run: npx vitest run
        working-directory: frontend

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ matrix.os }}-node${{ matrix.node-version }}
          path: frontend/dist/

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: "Test (workspace: solver-core + sketch-solver + mate-solver)"
        run: cargo test --workspace

      - name: Lint (clippy)
        run: cargo clippy --workspace -- -D warnings

      - name: Build WASM (web + nodejs, both solver crates)
        run: |
          cd sketch-solver
          wasm-pack build --target web --out-dir pkg --release
          wasm-pack build --target nodejs --out-dir pkg-node --release
          cd ../mate-solver
          wasm-pack build --target web --out-dir pkg --release
          wasm-pack build --target nodejs --out-dir pkg-node --release

  # Full-document parity gate. Runs the TS kernel (OCC.js + Rust sketch solver)
  # against the frozen regression baseline (a golden snapshot of the now-deleted
  # Python kernel) and hard-fails on any divergence. The Python kernel was removed
  # in phase 4d, so this is a post-migration regression gate, not a live
  # old-vs-new comparison. Heavy: OCC.js ~66 MB download + WASM compile.
  parity:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM solvers (nodejs for vitest)
        run: |
          wasm-pack build --target nodejs --out-dir pkg-node --release
          cd ../mate-solver && wasm-pack build --target nodejs --out-dir pkg-node --release
        working-directory: sketch-solver

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm install
        run: npm install
        working-directory: frontend

      - name: Install OCC.js (opt-in, not a package.json dep)
        run: npm run occ:install
        working-directory: frontend

      # Defense-in-depth: pkg-node is already built above, so run the solver
      # boundary tests here too. Keeps them covered even if the wasm build is
      # ever dropped from the `frontend` job. OCC.js is not needed for these.
      - name: Solver boundary tests (wasm-kernel)
        run: npx vitest run src/wasm-kernel
        working-directory: frontend

      - name: Parity gate (hard-fail)
        run: npx vitest run --config vitest.parity.config.ts
        working-directory: frontend
