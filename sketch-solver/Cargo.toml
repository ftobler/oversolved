[package]
name = "sketch-solver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Sketch constraint solver: flat I/O codec, residual builders, sketch area topology, over the shared Levenberg-Marquardt driver."

[lib]
# cdylib for the wasm-pack/wasm-bindgen build; rlib so native `cargo test` and
# a headless CLI/Node runner can link it.
crate-type = ["cdylib", "rlib"]

[features]
# The area-builder invariant oracle plus the node-side violation check it backs
# (`check_topology_violations`). Not a default feature: the production WASM
# binary never pays for the oracle. Plain `cargo test` compiles it anyway via
# `cfg(any(test, feature = "fuzz"))` on the module, so the default gate runs the
# oracle tests while `wasm-pack build --release` (no features) stays lean; the
# node build that the repro test drives is the one explicit opt-in.
fuzz = []

[dependencies]
# The LM driver, sparse Jacobian rows, and byte cursors are shared with the mate
# solver; see the workspace root Cargo.toml for why they live in their own crate.
solver-core.workspace = true
nalgebra.workspace = true

# serde + serde_json back ONLY the topology boundary (`detect_topology_bytes`):
# its payload is nested/variable (edges-per-surface, holes), so it crosses as
# self-describing JSON rather than the hand-rolled flat solve codec, which is
# left untouched. Compiles cleanly to wasm32.
serde.workspace = true
serde_json.workspace = true

# wasm-bindgen is only needed for the wasm32 boundary (src/wasm.rs). Keeping it
# target-scoped means native `cargo test` never pulls in the JS-glue crate.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
