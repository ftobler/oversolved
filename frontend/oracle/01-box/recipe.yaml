kind: part
features:
  - id: sk1
    kind: sketch
    plane: "@builtin_plane_front"
    entities:
      - id: bottom
        kind: line
      - id: right
        kind: line
      - id: top
        kind: line
      - id: left
        kind: line
    initial:
      bottom:
        - 0
        - 0
        - 20
        - 0
      right:
        - 20
        - 0
        - 20
        - 10
      top:
        - 20
        - 10
        - 0
        - 10
      left:
        - 0
        - 10
        - 0
        - 0
    constraints:
      - id: c1
        kind: coincident
        a:
          entity: bottom
          point: end
        b:
          entity: right
          point: start
      - id: c2
        kind: coincident
        a:
          entity: right
          point: end
        b:
          entity: top
          point: start
      - id: c3
        kind: coincident
        a:
          entity: top
          point: end
        b:
          entity: left
          point: start
      - id: c4
        kind: coincident
        a:
          entity: left
          point: end
        b:
          entity: bottom
          point: start
      - id: c5
        kind: horizontal
        target:
          entity: bottom
      - id: c6
        kind: horizontal
        target:
          entity: top
      - id: c7
        kind: vertical
        target:
          entity: right
      - id: c8
        kind: vertical
        target:
          entity: left
      - id: c9
        kind: length
        target:
          entity: bottom
        value: 20
      - id: c10
        kind: length
        target:
          entity: left
        value: 10
  - id: ex1
    kind: extrude
    extrude:
      sketch: $sk1
      distance: 6
      direction: normal
      operation: new
