kind: part
features:
  - id: sk1
    kind: sketch
    plane: "@builtin_plane_front"
    entities:
      - id: bottom
        kind: line
      - id: right
        kind: line
      - id: top
        kind: line
      - id: left
        kind: line
    initial:
      bottom:
        - 0
        - 0
        - 10
        - 0
      right:
        - 10
        - 0
        - 10
        - 10
      top:
        - 10
        - 10
        - 0
        - 10
      left:
        - 0
        - 10
        - 0
        - 0
    constraints:
      - id: c1
        kind: coincident
        a:
          entity: bottom
          point: end
        b:
          entity: right
          point: start
      - id: c2
        kind: coincident
        a:
          entity: right
          point: end
        b:
          entity: top
          point: start
      - id: c3
        kind: coincident
        a:
          entity: top
          point: end
        b:
          entity: left
          point: start
      - id: c4
        kind: coincident
        a:
          entity: left
          point: end
        b:
          entity: bottom
          point: start
      - id: c5
        kind: horizontal
        target:
          entity: bottom
      - id: c6
        kind: horizontal
        target:
          entity: top
      - id: c7
        kind: vertical
        target:
          entity: right
      - id: c8
        kind: vertical
        target:
          entity: left
      - id: c9
        kind: length
        target:
          entity: bottom
        value: 10
      - id: c10
        kind: length
        target:
          entity: left
        value: 10
  - id: ex1
    kind: extrude
    extrude:
      sketch: $sk1
      distance: 5
      direction: normal
      operation: new
  - id: sk2
    kind: sketch
    plane: "@builtin_plane_front"
    entities:
      - id: p1
        kind: point
    initial:
      p1:
        - 5
        - 5
  - id: h1
    kind: hole
    hole:
      sketch: "@sk2"
      diameter: 4
      depth_mode: through_all
      depth: 1
      target: "@body_ex1"
      direction: normal
  - id: ar1
    kind: array
    array:
      source_body: "@body_ex1"
      mode: linear
      operation: add
      include_source: true
      count_x: 3
      pitch_x: 30
      direction_x_query: "@sk1/bottom"
