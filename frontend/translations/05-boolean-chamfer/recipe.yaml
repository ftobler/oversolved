    kind: sketch
    plane: "@builtin_plane_front"
    entities:
      - id: bottom
        kind: line
      - id: right
        kind: line
      - id: top
        kind: line
      - id: left
        kind: line
    initial:
      bottom: [-15, -10, 15, -10]
      right: [15, -10, 15, 10]
      top: [15, 10, -15, 10]
      left: [-15, 10, -15, -10]
