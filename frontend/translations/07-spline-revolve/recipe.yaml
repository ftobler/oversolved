kind: part
features:
  - id: sk1
    kind: sketch
    plane: "@builtin_plane_front"
    entities:
      - id: bottom
        kind: line
      - id: sp
        kind: fit_spline
      - id: top
        kind: line
      - id: left
        kind: line
    initial:
      bottom: [0, 0, 1, 0]
      sp: [1, 0, 1.5, 1, 1.2, 2, 1, 3]
      top: [1, 3, 0, 3]
      left: [0, 3, 0, 0]
  - id: sk_axis
    kind: sketch
    plane: "@builtin_plane_front"
    entities:
      - id: axis
        kind: line
        construction: true
    initial:
      axis: [0, 0, 0, 3]
  - id: rv1
    kind: revolve
    revolve:
      sketch: $sk1
      angle: 360
      axis: "@sk_axis/axis"
      operation: new
