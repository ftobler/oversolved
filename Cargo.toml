# Rust workspace for the CAD solver kernels.
#
# Four crates, two WASM binaries. `solver-core` holds what both solvers
# genuinely share (the Levenberg-Marquardt driver, the sparse row type, the
# little-endian byte cursor); `geom-core` holds the pure 2D geometry (curves,
# profiles, fits) that never touches OCC and compiles INTO the sketch-solver
# binary rather than shipping as a package of its own; `sketch-solver` and
# `mate-solver` each compile to their own wasm-pack package so the two Workers
# that load them (the OCC/sketch builder Worker and the anchor solver Worker)
# stop paying for each other's code, and so their wire formats can be versioned
# independently.

[workspace]
resolver = "2"
members = ["solver-core", "geom-core", "sketch-solver", "mate-solver"]

[workspace.package]
version = "0.0.0"
edition = "2021"
# `Option::is_none_or` (used by the sketch solver) stabilized in 1.82; the
# toolchain here is newer, but this documents the floor the crates rely on.
rust-version = "1.82"
publish = false

[workspace.dependencies]
# nalgebra supplies the dense matrix + SVD primitives the LM driver and the
# rank / null-space analysis need. `default-features = false` + `std` keeps the
# pulled-in surface small and wasm32-friendly (no rand-backed paths we don't
# use). The Levenberg-Marquardt driver itself is hand-rolled (see
# solver-core/src/lm.rs) for exact damping/rank control; we deliberately do not
# pull in `argmin`.
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
solver-core = { path = "solver-core" }
geom-core = { path = "geom-core" }

# Release profile is workspace-wide: both wasm binaries want the same
# size/speed treatment.
[profile.release]
opt-level = 3
lto = true
