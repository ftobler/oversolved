# Dev-only PostgreSQL server.
# Usage: docker compose -f docker-compose-postgres.yml up -d

services:
  postgres-dev:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: oversolved
      POSTGRES_USER: oversolved
      POSTGRES_PASSWORD: oversolved
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oversolved"]
      interval: 10s
      timeout: 3s
      retries: 5
