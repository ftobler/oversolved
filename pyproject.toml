[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["oversolve*"]

[project]
name = "oversolve"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bottle",
    "waitress",
    "jax[cpu]",
    "cadquery-ocp",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy",
    "flake8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true

[tool.flake8]
max-line-length = 250
