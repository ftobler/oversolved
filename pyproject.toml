[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["oversolved*"]

[project]
name = "oversolved"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask",
    "flask-sock",
    "waitress",
    "gunicorn",
    "gevent",
    "jax[cpu]",
    "scipy",
    "pyyaml",
    "multimethod",
    "PyMySQL",
    "psycopg2-binary",
    "pillow",
    "websockets",
]

[project.scripts]
oversolved = "oversolved.cli:main"
oversolved-solver = "oversolved.solver_daemon:main"

[project.optional-dependencies]
solver = ["cadquery"]
dev = [
    "pytest",
    "mypy",
    "flake8",
    "pycairo",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "repeat: mark a test to be repeated multiple times",
]
filterwarnings = []

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
explicit_package_bases = true
namespace_packages = true

[tool.flake8]
max-line-length = 250
extend-ignore = ["F401"]
