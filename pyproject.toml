[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["oversolved*"]

[project]
name = "oversolved"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "waitress>=3.0",
    "gunicorn>=22.0",
    "gevent",
    "numpy>=1.26",
    "scipy>=1.12",
    "pyyaml>=6.0",
    "multimethod",
    "psycopg2-binary>=2.9",
    "pillow",
    "websockets>=12.0",
    "croniter>=2.0",
]

[project.scripts]
oversolved = "oversolved.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy",
    "flake8",
    "pycairo>=1.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "repeat: mark a test to be repeated multiple times",
]
filterwarnings = []

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
explicit_package_bases = true
namespace_packages = true

