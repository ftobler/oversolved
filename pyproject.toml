[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["oversolved*"]

[project]
name = "oversolved"
version = "0.1.0"
requires-python = ">=3.12"
# The app is browser-only (IndexedDB + WASM); no Python runs at runtime. What
# is left of the package is build-time icon generation, whose only dependency
# (pycairo) belongs to the dev extra alongside the lint/type/test gates.
dependencies = []

[project.optional-dependencies]
# The gates are pinned with conservative upper bounds because a surprise major
# bump in the checker itself changes what "green" means without any source
# change; pycairo tracks the system cairo ABI and is bounded the same way.
dev = [
    "pytest>=8,<10",
    "pytest-cov<9",
    "mypy>=1.10,<3",
    "flake8<9",
    "ruff>=0.6,<1",
    "pycairo>=1.25,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "repeat: mark a test to be repeated multiple times",
]
filterwarnings = []

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
explicit_package_bases = true
namespace_packages = true
check_untyped_defs = true

[tool.ruff]
# Local gate only; CI still runs flake8 with its default E/F/W rule set, so the
# lint select must match that coverage or the local gate silently weakens.
line-length = 250

[tool.ruff.lint]
select = ["E", "F", "W"]

